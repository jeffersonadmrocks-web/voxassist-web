name: Whirlpool Online Worker

on:
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/whirlpool/**"
      - "supabase/functions/whirlpool-worker-api/**"
      - ".github/workflows/whirlpool-online-worker.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: whirlpool-online-worker-serra
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: workers/whirlpool
    env:
      WHIRLPOOL_WORKER_API_URL: https://dgasmtvpgifceyqufcfg.supabase.co/functions/v1/whirlpool-worker-api
      WHIRLPOOL_BATCH_LIMIT: "3"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install worker
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run guarded Whirlpool batches
        shell: bash
        run: |
          # Keep claiming while the queue has work. Each claim stays small
          # so failures do not hold the whole backlog in a single lease.
          started=$SECONDS
          round=0
          while (( SECONDS - started < 10080 )); do
            round=$((round + 1))
            echo "Whirlpool batch $round"
            log="$RUNNER_TEMP/whirlpool-batch-$round.log"
            npm run run-online | tee "$log"
            more=$(node -e '
              const fs = require("node:fs");
              const lines = fs.readFileSync(process.argv[1], "utf8").trim().split("\n");
              const batch = JSON.parse(lines.at(-1));
              console.log(batch.results.length === 3 && batch.results.every(item => item.status === "IMPORTADA") ? "yes" : "no");
            ' "$log")
            if [[ "$more" != "yes" ]]; then
              echo "Batch was not fully imported; leaving remaining work for the next scheduled run."
              break
            fi
          done
          echo "Queue drained, batch interrupted, or time budget reached after $round batches."
      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whirlpool-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: workers/whirlpool/.artifacts/diagnostics
          if-no-files-found: ignore
          retention-days: 14
